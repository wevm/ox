# Whether each public function has a call in ox's tests that call-types measures; the note says
# why not. It shares the call-types script's run.
type-coverage:
  run: bun .agents/uphill/types-calls.ts
  timeout: 20m
  type-benched:
    description: Call each public function in the runtime or type tests. Make sure the imports and fixtures of that call resolve.

fuzz:
  run: bun .agents/uphill/fuzz.ts
  # About 3 minutes at UPHILL_CONCURRENCY=2 to 4. The limit leaves room for a loaded machine and for
  # workers stopped on a hang or runaway memory, each of which is rerun alone.
  timeout: 20m
  # Whether each public function has a fuzz harness that ran: structured properties (round trips,
  # differentials against viem, ethers, noble, scure and micro-eth-signer, consistency) or boundary
  # mutations of the arguments ox's tests pass it. The note lists the harnesses, or says why there
  # is none.
  fuzzed:
    description: Make sure each public function has a fuzz harness that runs.
  # Whether fuzzing found no failure: no undocumented TypeError, RangeError, or SyntaxError on an
  # input that keeps the declared types, no stack overflow, hang, or runaway memory, and no broken
  # round trip, differential, or consistency property. The note gives the minimized input.
  fuzz-clean:
    description: Handle every input that keeps the declared types. Throw no undocumented TypeError, RangeError, or SyntaxError, and avoid stack overflows, hangs, and runaway memory. Keep each structured fuzz property true.
  # Percent of the function's own source lines in the build that ran under fuzzing (V8 precise
  # coverage).
  fuzz-coverage:
    description: Make every line of a public function's own source reachable by fuzzing.
    target: 90
    better: higher
  # The hot items of .agents/uphill/hot.ts: every line of their own source should run under
  # fuzzing.
  hot-fuzz-coverage: { target: 100, better: higher }

# ox measures its own library categories above, so it takes only the typescript pack's convention
# categories. `uphill rules --write` writes each metric's `description`, the packs' included, to
# .agents/uphill/rules.md, which AGENTS.md loads. The `hot-*` and `bench-instantiations` metrics
# have none, since their per-item targets would fill the rules file.
packs:
  - {
      pack: wevm/uphill/packs/typescript@f71fba4d199409cbc8bf00d713dab4b24d91b980,
      categories:
        [
          correctness,
          style,
          architecture,
          documentation,
          testing,
          configuration,
        ],
      install: true,
    } # main
  - {
      pack: wevm/uphill/packs/git@f71fba4d199409cbc8bf00d713dab4b24d91b980,
      install: true,
    } # main
