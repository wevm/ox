# ox's metrics. ox's main and 0.x branches share them: the same scripts in .agents/uphill, the same
# metrics, defaults, item names and hot set, so a target pattern means the same item on both. Only
# .agents/uphill/repo.ts, which says where the branch builds and which entry points it publishes,
# the fuzz properties and corpus, the extra speed calls in speed-calls.test.ts, and the target maps
# that each branch sets from its own measurements differ. Each script fans out over every public
# export of every entry point, and over every public function, so each scores on its own. Items are
# named the way users import them: a namespace member as `<index entry>:<Namespace>.<member>`, such
# as `ox:Hex.fromString` or `ox/tempo:SignatureEnvelope.sortApprovals`; a whole namespace as
# `ox:Hex`; a whole index entry by its specifier, such as `ox` or `ox/tempo`. The per-module metrics
# (`tree-shaking`, `import-time` and `import-memory`) name their items by the module entry, such as
# `ox/Hex`. The scripts measure the build that `pnpm build` writes.
#
# There is no latency category: ox's few async functions (WebAuthn, WebCrypto, Keystore, AesGcm,
# RpcTransport) chain no independent requests.

# Install scripts stay off, so the contracts submodule and Foundry are not needed: the speed script
# records ox's tests, which use the committed contract artifacts and Anvil. The scripts keep their
# own dependencies, such as rolldown, fast-check, viem and ethers, in .agents/uphill.
setup: 'pnpm install --frozen-lockfile --ignore-scripts && pnpm build && bun install --cwd .agents/uphill'

footprint:
  run: bun .agents/uphill/footprint.ts
  # Gzipped bytes a consumer bundles to import one export the way users import it, such as
  # `import { Hex } from 'ox'; export const $ = Hex.fromNumber` for `ox:Hex.fromNumber`, a whole
  # namespace, such as `ox:Hex`, or a whole index entry, such as `ox/tempo`. rolldown bundles and
  # minifies each import for the browser. A function that signs, verifies, or derives a key bundles
  # noble's curve; encoders, decoders and envelopes without a curve bundle 1 to 9 kB, so the default
  # is 10 kB. Each branch sets the targets below just above its own sizes for what has no known
  # change, and at what a known change gives for the rest. The first matching pattern applies.
  entry-size:
    description: Keep the gzipped bundle small for a consumer that imports one export. Do not pull unrelated modules or packages into an export.
    target: 10kB
    targets:
      # An error class extends `BaseError` (about 0.7 kB) and adds a message. 1 kB asks for the
      # errors whose messages format an ABI item (1.1 kB) to format it without the ABI printer,
      # `Provider`'s errors without eventemitter3, and `SignatureErc8010`'s without the
      # human-readable ABI parser.
      '*:*.*Error': 1kB
      # The trusted setup is data: 400 kB of G1 and G2 points.
      ox/trusted-setups*: 410kB
      ox/wasm: 260kB
      ox: 215kB
      ox/node: 120kB
      ox/zod: 125kB
      'ox/zod:z': 125kB
      ox/tempo: 65kB
      'ox/wasm:*': 130kB
      # The `eth_` and `wallet_` schemas are data. The codecs and errors need none of them.
      'ox/zod:z.RpcSchema': 26kB
      'ox/zod:z.RpcSchema.Default': 26kB
      'ox/zod:z.RpcSchema.Eth': 26kB
      'ox/zod:z.RpcSchema.Wallet': 26kB
      'ox/zod:z.RpcSchema.*': 4kB
      # Mnemonic re-exports every BIP-39 wordlist.
      '*:Mnemonic': 100kB
      'ox/zod*': 60kB
      '*:Bls*': 28kB
      '*:Mnemonic.*': 26kB
      '*:HdKey*': 26kB
      '*:*fromMnemonic': 26kB
      'ox/webauthn*': 28kB
      '*:WebAuthn*': 22kB
      '*:TransactionRequest*': 40kB
      'ox/tempo*': 40kB
      '*:Secp256k1*': 22kB
      '*:P256*': 20kB
      '*:Ed25519*': 20kB
      '*:X25519*': 20kB
      '*:MlDsa44*': 20kB
      '*:Signature*': 22kB
      '*:TransactionEnvelope*': 22kB
      '*:TxEnvelope*': 22kB
      '*:Transaction*': 22kB
      '*:Ens*': 18kB
      'ox/erc*': 22kB
  # Whether each module entry, such as `ox/Hex`, has no top-level code a bundler must keep: a call
  # without a `/*#__PURE__*/` annotation, a `2n ** 8n`, a runtime TypeScript namespace, or a static
  # class field. Such code stays in every bundle that uses anything from the module, and in a
  # bundle that imports the module for nothing once ox's `"sideEffects": false` is out of reach, as
  # when ox is inlined into another package's bundle. The note names what stays.
  tree-shaking:
    description: Make each entry point bundle to nothing when unused. Annotate top-level calls with `/*#__PURE__*/`, and avoid runtime TypeScript namespaces and static class fields.
  # The parts of ox its users lean on most, listed in .agents/uphill/hot.ts, scored on their own,
  # since a few dozen items that miss their targets would hide under entry-size's p90. Each hot
  # target is what a comparable library already achieves: the item's value today times the best
  # ratio that the other ox branch's latest build, viem 2, or ethers 6 shows for the same function,
  # bundled, timed, or checked the same way. A lead under 10%, or one that saves less than 100 B,
  # 10 ns, 64 B, 2 ms, 100 kB, or 50 instantiations, holds the item at its value today, and so do the
  # exceptions in the shared spec's parity ledger. The comment on each target names its reference.
  hot-entry-size:
    target: 10kB
    targets:
      'ox:Hex.fromBytes': 1.3kB # today 1.3kB
      'ox:Hex.fromNumber': 1.4kB # today 1.4kB
      'ox:Hex.slice': 950B # today 950B
      'ox:Hash.keccak256': 3.2kB # today 3.9kB; ethers 1.2× better
      'ox:Hex.size': 92B # today 92B
      'ox:Bytes.fromString': 1.3kB # today 1.3kB
      'ox:Hex.concat': 140B # today 140B
      'ox:Hex.toBigInt': 830B # today 830B
      'ox:Signature.fromHex': 1.7kB # today 2.3kB; ox 0.x 1.4× better
      'ox:Address.isEqual': 940B # today 940B
      'ox:Signature.toHex': 2.1kB # today 2.1kB
      'ox:Hex.fromString': 1.4kB # today 1.6kB; viem 1.2× better
      'ox:Hex.validate': 180B # today 170B
      'ox:Bytes.from': 1.2kB # today 1.6kB; ox 0.x 1.3× better
      'ox:Bytes.concat': 160B # today 150B
