# How much of ox the speed bench reaches. It shares the speed script's run.
coverage:
  run: bun .agents/uphill/speed.ts
  timeout: 60m
  # Whether each public function has a call the bench can replay: one that returned or resolved in
  # ox's tests (or in .agents/uphill/speed-calls.test.ts) with arguments that rebuild in another
  # process. The note says why not otherwise, such as a function every test calls with a closure.
  benched:
    description: Call each public function in the tests with arguments that rebuild in another process, such as plain data. Make sure the call returns or resolves.

# Type-checking cost of every public export, values and types, from the built declarations. Each
# export gets a consumer that imports it and forces its type to resolve, checked in a fresh program
# with ox's compiler options, minus a baseline that only imports the entry. It writes times, so
# Uphill runs it 5 times. It needs Node 26 or later, whose V8 reports the bytes a check allocates
# (`total_allocated_bytes`); with an older `node` first on PATH, it runs its workers on
# `npx --yes node@26`, which needs the network the first time.
types:
  run: bun .agents/uphill/types.ts
  timeout: 15m
  # Type instantiations to check one use of each public export, values and types, with namespace
  # members counted as exports. A use is `typeof` the value, with `Parameters` and `ReturnType` for
  # a function, or the type at its defaults, plus one level of properties. Each export is checked
  # in its own program, minus a program that only imports its entry. Most exports cost under 200;
  # RPC conversions and ABI utilities infer over unions of every transaction or ABI type.
  instantiations:
    description: Keep each public export cheap to type-check. Avoid types that need many instantiations to resolve.
    target: 1000
    targets:
      # Any zod schema's type starts near 2,000 instantiations of zod's own types.
      'ox/zod:*': 2500
      # abitype's ABI and typed-data types start near 12,000 (its TypedData alone costs 11,700).
      'ox:Abi*': 5000
      'ox:TypedData*': 5000
      'ox/erc4337:UserOperation.toTypedData': 5000
  # CPU time to check that use. p50 1 ms, p90 4 ms outside zod.
  check-time:
    description: Keep each public export fast to type-check.
    target: 5ms
    targets:
      'ox/zod:*': 15ms
      'ox:Abi*': 25ms
      'ox:TypedData*': 25ms
      'ox/erc4337:UserOperation.toTypedData': 25ms
  # Heap bytes that check allocates. p90 1.1 MB outside zod.
  check-memory:
    description: Keep the heap bytes that type-checking each public export allocates small.
    target: 2MB
    varies: true
    targets:
      'ox/zod:*': 10MB
      'ox:Abi*': 25MB
      'ox:TypedData*': 25MB
      'ox/erc4337:UserOperation.toTypedData': 25MB
  # Instantiations attest counts for each test of the attest files (`*.snap-d.ts` and
  # `*.bench-d.ts`), isolated the way `attest.instantiations` isolates a test, against ox's sources
  # and the tsconfig its type tests use. Most tests pin type strings, not counts, so each target is
