      'ox:Hex.padLeft': 990B # today 980B
      'ox:AbiParameters.encode': 7kB # today 7kB
      'ox:Bytes.fromNumber': 1.4kB # today 1.3kB
      'ox:Signature.from': 2.1kB # today 2.9kB; ox 0.x 1.4× better
      'ox:Address.validate': 3.8kB # today 4.6kB; ethers 1.2× better
      'ox:PublicKey.toHex': 2kB # today 1.9kB
      'ox:Hex.toNumber': 1.1kB # today 1kB
      'ox:Json.stringify': 150B # today 140B
      'ox:Address.fromPublicKey': 4.6kB # today 5.5kB; viem 1.2× better
      'ox:Address.checksum': 3.7kB # today 4.5kB; ethers 1.2× better
