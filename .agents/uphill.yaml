# Whether each public function has a call in ox's tests that call-types measures; the note names
# the test or says why not.
type-coverage:
  run: bun .agents/metrics/types-calls.ts
  timeout: 10m
  type-benched: {}

fuzz:
  run: bun .agents/metrics/fuzz.ts
  # About 2.5 minutes at UPHILL_CONCURRENCY=2. The limit leaves room for a loaded machine and for
  # workers stopped on a hang or runaway memory, each of which is rerun alone.
  timeout: 15m
  # Whether each public function had a harness that ran: structured properties (round trips,
  # re-encoding of recorded values, differentials against viem, ethers, noble, @scure/base,
  # @ethereumjs/rlp and micro-eth-signer, consistency) and boundary mutations of the arguments ox's
  # tests pass it (fuzz-fixtures/corpus.json). The note lists the harnesses and their call counts.
  fuzzed: {}
  # Whether fuzzing found no failure: no TypeError, RangeError, SyntaxError or ReferenceError on an
  # input that keeps the declared types, no stack overflow, hang or runaway memory, and no broken
  # round trip, differential or consistency property. The note gives the minimized input.
  fuzz-clean: {}
  # Percent of the function's own source lines in src/_esm that ran under fuzzing (V8 precise
  # coverage).
  fuzz-coverage: { target: 90, better: higher }
  # The hot items of .agents/metrics/hot.ts: every line of their own source should run under
  # fuzzing.
  hot-fuzz-coverage: { target: 100, better: higher }
