speed:
  run: bun .agents/metrics/speed.ts
  # Recording ox's core and Tempo unit tests takes about 3 minutes and replaying them about 3 at
  # concurrency 4. The recording is cached until the tests or the build change.
  timeout: 40m
  # CPU time per call of each public function, replaying the arguments ox's tests call it with, in
  # a fresh process per function. ox's caches are emptied before every call, so each call does a
  # first call's work, and the note gives the time with them warm. Three quarters of the calls take
  # under 10 µs, so the default is 20 µs, the same as on ox's 0.x branch. Cryptography and key
  # derivation whose cost is noble's has a target about 1.5 times its time today, since CPU time
  # varies between runs. Keccak-bound hashing (typed data, ABI selectors, transaction hashes) keeps
  # the default, so it shows as the opportunity it is. The first matching pattern applies.
  call-time:
    target: 20µs
    targets:
      # Key derivation whose cost is its iteration count: PBKDF2 at 262,144 rounds, WebCrypto
      # PBKDF2 at 900,000 rounds for AES-GCM keys, BIP-39 seeds at 2,048 rounds, and scrypt.
      'ox:Keystore.pbkdf2*': 500ms
      'ox:AesGcm.getKey': 180ms
      'ox:Keystore.toKey*': 50ms
      '*:*fromMnemonic': 16ms
      '*:Mnemonic.to*': 16ms
      'ox:Keystore.scrypt*': 5ms
      # BLS12-381 pairings and hashing to the curve.
      '*:Bls.*': 45ms
      '*:BlsPoint.*': 1.5ms
      '*:MlDsa44.*': 8ms
      # Ordering approvals recovers each signer once.
      'ox/tempo:SignatureEnvelope.sortApprovals': 7ms
      'ox/tempo:AccountOperation.selectApprovals': 7ms
      # Public key recovery, verification and ECDH.
      '*:*.recover*': 3.5ms
      '*:*.verify': 3.5ms
      '*:*.getSharedSecret': 3.5ms
      'ox/tempo:SignatureEnvelope.extractPublicKey': 2.5ms
      # Wrapping recovers the authorization's signer when `to` is missing.
      'ox/erc8010:SignatureErc8010.wrap': 2ms
      # Extended keys check their public key on the curve.
      '*:HdKey.*': 1.1ms
      '*:X25519.*': 1.1ms
      '*:*.sign': 500µs
      '*:*.getPublicKey': 500µs
      '*:*.createKeyPair': 500µs
      '*:Mnemonic.*': 350µs
      'ox:Blobs.*': 400µs
      'ox:BinaryStateTree.*': 400µs
  # Heap bytes each call allocates. Three quarters of the calls allocate under 6 kB, so the default
  # is 20 kB, the same as on ox's 0.x branch. The same cryptography has a target about 1.25 times
  # its allocation today, which barely varies.
  call-memory:
    varies: true
    target: 20kB
    targets:
      'ox:Keystore.pbkdf2*': 350MB
      'ox:Keystore.toKey*': 5MB
      '*:*fromMnemonic': 13MB
      '*:Mnemonic.to*': 13MB
      '*:Bls.*': 36MB
      '*:BlsPoint.*': 1.5MB
      '*:MlDsa44.*': 4MB
      'ox/tempo:SignatureEnvelope.sortApprovals': 4.5MB
      'ox/tempo:AccountOperation.selectApprovals': 4.5MB
      '*:*.recover*': 2.3MB
      '*:*.verify': 2.3MB
      '*:*.getSharedSecret': 2.6MB
      'ox/tempo:SignatureEnvelope.extractPublicKey': 1.5MB
      'ox/erc8010:SignatureErc8010.wrap': 1.5MB
      '*:HdKey.*': 1MB
      '*:X25519.*': 1MB
      '*:*.sign': 600kB
      '*:*.getPublicKey': 600kB
      '*:*.createKeyPair': 600kB
      'ox:Keystore.scrypt*': 20MB
      'ox:AesGcm.*': 200kB
      'ox:Blobs.*': 2MB
  # CPU time to import each entry point in a fresh Node process. An entry that loads only the
  # modules it uses imports in about 40 ms; the root and zod entries load everything.
  import-time:
    # Half the entries import in under 45 ms, against 28 ms on ox's 0.x branch. 60 ms, the default
    # on both branches, asks for the envelope entries (`ox/TxEnvelope*` and
    # `ox/TransactionRequest`, 77 to 85 ms) to stop loading every envelope type, and for
    # `ox/erc8010` (93 ms) to stop parsing ABI parameters at load.
    target: 60ms
    targets:
      ox/zod*: 350ms
      ox: 230ms
      ox/tempo*: 120ms
      ox/wasm*: 150ms
      ox/node*: 150ms
  # Heap bytes each entry point holds once imported. The default is 3.5 MB, the same as on ox's
  # 0.x branch; the root, zod and engine entries load everything.
  import-memory:
    target: 3.5MB
    targets:
      ox/zod*: 25MB
      ox: 8MB
      ox/tempo*: 6MB
      ox/wasm*: 6MB
      ox/node*: 6MB
  # The hot items of .agents/metrics/hot.ts, scored on their own, each against a tenth of its
  # time, memory or import cost today, and scored by the median, as hot-entry-size explains. Call
  # times stop at 50 ns, where a call is too short to time, allocations at 64 B, imports at 2 ms,
  # about what a module without imports takes, and import memory at 100 kB.
  hot-call-time:
