      'ox:Hex.validate': 150B # today 720B; ethers 4.7× better
      'ox:Bytes.from': 1.2kB # today 1.5kB; ox 0.14 1.3× better
      'ox:Bytes.concat': 130B # today 700B; viem 5.3× better
      'ox:Hex.random': 1.3kB # today 1.2kB
      'ox:Hex.padLeft': 880B # today 870B
      'ox:AbiParameters.encode': 7.2kB # today 7.1kB
      'ox:Bytes.fromNumber': 1.2kB # today 1.2kB
      'ox:Signature.from': 2.5kB # today 2.9kB; ox 0.14 1.2× better
      'ox:Address.validate': 3.8kB # today 4.6kB; ethers 1.2× better
      'ox:PublicKey.toHex': 1.9kB # today 1.8kB
      'ox:Hex.toNumber': 1.1kB # today 1kB
