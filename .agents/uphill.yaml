# Whether each public function has a call in ox's tests that call-types measures; the note says
# why not. It shares the call-types script's run.
type-coverage:
  run: bun .agents/uphill/types-calls.ts
  timeout: 20m
  type-benched: {}

fuzz:
  run: bun .agents/uphill/fuzz.ts
  # About 3 minutes at UPHILL_CONCURRENCY=2 to 4. The limit leaves room for a loaded machine and for
  # workers stopped on a hang or runaway memory, each of which is rerun alone.
  timeout: 20m
  # Whether each public function has a fuzz harness that ran: structured properties (round trips,
  # differentials against viem, ethers, noble, scure and micro-eth-signer, consistency) or boundary
  # mutations of the arguments ox's tests pass it. The note lists the harnesses, or says why there
  # is none.
  fuzzed: {}
  # Whether fuzzing found no failure: no undocumented TypeError, RangeError, or SyntaxError on an
  # input that keeps the declared types, no stack overflow, hang, or runaway memory, and no broken
  # round trip, differential, or consistency property. The note gives the minimized input.
  fuzz-clean: {}
  # Percent of the function's own source lines in the build that ran under fuzzing (V8 precise
  # coverage).
  fuzz-coverage: { target: 90, better: higher }
  # The hot items of .agents/uphill/hot.ts: every line of their own source should run under
  # fuzzing.
  hot-fuzz-coverage: { target: 100, better: higher }
