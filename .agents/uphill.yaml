# ox's metrics. Each script fans out over every public export of the entry points in package.json,
# and over every public function, so each export and function scores on its own. The scripts
# measure the build that `pnpm build` writes to dist.

# Install scripts stay off, so the contracts submodule and Forge are not needed: the speed script
# records ox's tests, which use the committed contract artifacts and Anvil. The scripts keep their
# own dependencies, such as rolldown, viem, and ethers, in .agents/metrics.
setup: 'pnpm install --frozen-lockfile --ignore-scripts && pnpm build && bun install --cwd .agents/metrics'

footprint:
  run: bun .agents/metrics/footprint.ts
  # Gzipped bytes a consumer bundles to import one export from its entry point, such as
  # `ox:Hex.fromNumber`, a namespace, such as `ox:Hex`, or the whole entry, such as `ox/tempo`.
  # rolldown bundles and minifies each import for the browser. Most members bundle under 4 kB and
  # the p90 is 14 kB, which the curves set: a function that signs, verifies, or derives a key
  # bundles noble's curve. Encoders, decoders and envelopes without a curve bundle 1 to 9 kB, so
  # the default is 10 kB, the same as on ox's 0.x branch. The first matching pattern applies.
  entry-size:
    target: 10kB
    targets:
      # An error class extends `BaseError` (about 0.7 kB) and adds a message. 1 kB asks for the
      # errors whose messages format an ABI item (1.1 kB) to format it without the ABI printer,
      # `Provider`'s errors without eventemitter3, and `SignatureErc8010`'s without the
      # human-readable ABI parser.
      '*:*.*Error': 1kB
      # The trusted setup is data: 400 kB of G1 and G2 points.
      ox/trusted-setups*: 410kB
      ox/wasm: 260kB
      ox: 215kB
      ox/node: 120kB
      ox/zod: 125kB
      'ox/zod:z': 125kB
      ox/tempo: 65kB
      'ox/wasm:*': 130kB
      # The `eth_` and `wallet_` schemas are data. The codecs and errors need none of them.
      'ox/zod:z.RpcSchema': 26kB
      'ox/zod:z.RpcSchema.Default': 26kB
      'ox/zod:z.RpcSchema.Eth': 26kB
      'ox/zod:z.RpcSchema.Wallet': 26kB
      'ox/zod:z.RpcSchema.*': 4kB
      # Mnemonic re-exports every BIP-39 wordlist.
      '*:Mnemonic': 100kB
      'ox/zod*': 60kB
      '*:Bls*': 28kB
      '*:Mnemonic.*': 26kB
      '*:HdKey*': 26kB
      '*:*fromMnemonic': 26kB
      'ox/webauthn*': 28kB
      '*:WebAuthn*': 22kB
      '*:TransactionRequest*': 40kB
      'ox/tempo*': 40kB
      '*:Secp256k1*': 22kB
      '*:P256*': 20kB
      '*:Ed25519*': 20kB
      '*:X25519*': 20kB
      '*:MlDsa44*': 20kB
      '*:Signature*': 22kB
      '*:TransactionEnvelope*': 22kB
      '*:TxEnvelope*': 22kB
      '*:Transaction*': 22kB
      '*:Ens*': 18kB
      'ox/erc*': 22kB
  # Whether each module entry, such as `ox/Hex`, has no top-level code a bundler must keep: a call
  # without a `/*#__PURE__*/` annotation, a `2n ** 8n`, a runtime TypeScript namespace, or a static
  # class field. Such code stays in every bundle that uses anything from the module, and in a
  # bundle that imports the module for nothing once ox's `"sideEffects": false` is out of reach, as
  # when ox is inlined into another package's bundle. The note names what stays.
  tree-shaking: {}
  # The parts of ox its users lean on most, listed in .agents/metrics/hot.ts, scored on their own:
  # in entry-size, a few dozen items that miss their targets hide under its p90. Each target is a
  # tenth of what the item bundles today, and no lower than 250 B, about what a function that throws
  # no error bundles. Some tenths sit below what the work itself needs, such as keccak's or
  # secp256k1's code, so the list scores its median, which reaches 90 once half the items bundle
