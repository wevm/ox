# How much of ox the speed bench reaches. It shares the speed script's run.
coverage:
  run: bun .agents/metrics/speed.ts
  timeout: 60m
  # Whether each public function has a call the bench can replay: one that returned or resolved
  # in ox's tests (or in .agents/metrics/speed-calls.test.ts) with arguments that rebuild in
  # another process. The note says why not otherwise, such as "no test calls it" or "every
  # recorded call passes a function".
  benched: {}

# Type-checking cost of every public export of ox's leaf entries, values and types, from
# src/_types. Each export gets a consumer that imports it and forces its type to resolve: a
# function's typeof, Parameters and ReturnType (generics at their constraints), a class's
# ConstructorParameters and InstanceType, a type at its defaults or constraints, plus one level of
# members. Each is checked in a fresh program with tsconfig.base.json's options, minus a baseline
# that only imports the entry. It writes times, so Uphill runs it 5 times: about 2 minutes at
# UPHILL_CONCURRENCY=1. It needs Node 26 or later on PATH, whose V8 reports the bytes a check
# allocates (`total_allocated_bytes`); on earlier Node the workers stop and say so. Counting with
# `v8.GCProfiler` instead gives 0.45 to 0.93 times V8's count, so check-memory would not compare
# with its targets.
types:
  run: bun .agents/metrics/types.ts
  timeout: 15m
  # Instantiations to resolve the export, exact. p50 66, p90 1,018. ABI and typed-data types start
  # near 12,000 because abitype's do (its TypedData alone costs 11,700), so they get 5,000. The
  # same defaults as on ox's main branch.
  instantiations:
    target: 1000
    targets:
      'ox:Abi*': 5000
      'ox:TypedData*': 5000
      'ox/erc4337:UserOperation.toTypedData': 5000
