# Type-checking cost at the call sites ox's tests write: one call per public function, the first
# its own runtime tests make (else its type tests). Each call is copied into
# `const $uphill = <call>` and checked in a fresh checker once its imports and fixtures resolve.
# Instantiations are exact, so one run suffices.
call-types:
  run: bun .agents/metrics/types-calls.ts
  timeout: 20m
  # p50 20, p90 805. A call should cost under 1,000, and one that infers from an ABI or typed data
  # under 5,000, as on ox's 0.x branch. TypedData's non-generic helpers infer nothing, so they keep
  # 1,000. A call on a zod schema namespace gets 10,000. The first match applies.
  instantiations:
    target: 1000
    targets:
      'ox:TypedData.hashType': 1000
      'ox:TypedData.encodeType': 1000
      'ox:TypedData.hashStruct': 1000
      'ox:TypedData.*': 5000
      'ox:Abi*': 5000
      'ox/erc4337:UserOperation.*': 5000
      'ox/zod:*': 10000
