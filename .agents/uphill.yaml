speed:
  run: bun .agents/uphill/speed.ts
  # Recording ox's tests takes 1 to 3 minutes, and replaying them 3 to 6 minutes, depending on the
  # branch and UPHILL_CONCURRENCY. The recording is cached until the tests or the build change.
  timeout: 60m
  # CPU time per call of each public function, replaying the arguments ox's tests call it with, in
  # a fresh `node --single-threaded` process per function. ox's caches are emptied before every
  # call, so each call does a first call's work while caching still works inside it, and the note
  # gives the time with them warm. Three quarters of the calls take under 11 µs, so the default is
  # 20 µs. Cryptography and key derivation whose cost is noble's (or, for 0.x's KZG functions, the
  # micro-eth-signer KZG its tests inject) has a target about 1.5 times its time today on each
  # branch, since CPU time varies by up to 1.5 times between runs. Keccak-bound hashing (typed data,
  # ABI selectors, transaction hashes) keeps the default, so it shows as the opportunity it is. The
  # first matching pattern applies.
  call-time:
    target: 20µs
    targets:
      'ox:Blobs.toProofs': 2.6s
      'ox:Blobs.toCommitments': 1.8s
      'ox:Blobs.toVersionedHashes': 1.8s
      # 262,144 rounds of PBKDF2 by default, in noble or in WebCrypto.
      'ox:Keystore.pbkdf2': 620ms
      'ox:Keystore.pbkdf2Async': 60ms
      # 900,000 rounds of WebCrypto PBKDF2.
      'ox:AesGcm.getKey': 200ms
      # Key derivation with scrypt, or PBKDF2 at the recorded call's rounds.
      'ox:Keystore.*': 50ms
      'ox:Bls.verify': 38ms
      'ox:Bls.sign': 30ms
      'ox:Bls*': 1.5ms
      # BIP-39 derives the seed with 2,048 rounds of PBKDF2-HMAC-SHA512.
      '*:*.fromMnemonic': 16ms
      'ox:Mnemonic.to*': 17ms
      'ox:Mnemonic.*': 200µs
      # Each recovers every signer's public key once.
      'ox/tempo:AccountOperation.selectApprovals': 8ms
      'ox/tempo:SignatureEnvelope.sortApprovals': 7ms
      'ox/tempo:SignatureEnvelope.*': 3.5ms
      'ox/webauthn:Registration.verify': 3.7ms
      '*:*.getSharedSecret': 4ms
      '*:*.recover*': 3.4ms
      '*:*.verify': 3.5ms
      # Recovers the authorization's signer.
      'ox/erc8010:SignatureErc8010.wrap': 2.8ms
      'ox:X25519.*': 1.2ms
      'ox:HdKey.*': 1.1ms
      'ox:Blobs.*': 900µs
      'ox:Secp256k1.*': 600µs
      'ox:P256.*': 420µs
      'ox:Ed25519.*': 450µs
      'ox:WebCryptoP256.*': 150µs
      'ox:BinaryStateTree.*': 320µs
      # The recorded call converts a 128 kB blob.
      'ox:Bytes.toHex': 250µs
  # Heap bytes each call allocates. Three quarters of the calls allocate under 6 kB, so the default
  # is 20 kB. The same cryptography has a target about 1.25 times its allocation today on each
  # branch, which barely varies.
  call-memory:
    varies: true
    target: 20kB
    targets:
      'ox:Blobs.toProofs': 1.6GB
      'ox:Blobs.toCommitments': 1.1GB
      'ox:Blobs.toVersionedHashes': 1.1GB
      'ox:Keystore.pbkdf2': 300MB
      'ox:Keystore.pbkdf2Async': 15kB
      'ox:AesGcm.getKey': 25kB
      'ox:Keystore.*': 5MB
      'ox:Bls.verify': 28MB
      'ox:Bls.sign': 20MB
      'ox:Bls*': 800kB
      '*:*.fromMnemonic': 12MB
      'ox:Mnemonic.to*': 12.5MB
      'ox:Mnemonic.*': 360kB
      'ox/tempo:AccountOperation.selectApprovals': 4.2MB
      'ox/tempo:SignatureEnvelope.sortApprovals': 3.9MB
      'ox/tempo:SignatureEnvelope.*': 2.1MB
      'ox/webauthn:Registration.verify': 2.2MB
      '*:*.getSharedSecret': 2.6MB
      '*:*.recover*': 2.2MB
      '*:*.verify': 2.1MB
      'ox/erc8010:SignatureErc8010.wrap': 1.3MB
      'ox:X25519.*': 750kB
      'ox:HdKey.*': 630kB
      'ox:Blobs.*': 330kB
      'ox:Secp256k1.*': 330kB
      'ox:P256.*': 350kB
      'ox:Ed25519.*': 370kB
      'ox:BinaryStateTree.*': 450kB
      'ox:Bytes.toHex': 330kB
  # CPU time to import each entry point, index entries included, in a fresh Node process. The default
  # is 60 ms; the root entry, and on main the zod and engine entries, load everything.
  import-time:
    target: 60ms
    targets:
      ox: 230ms
      ox/tempo*: 120ms
      ox/Bls*: 100ms
  # Heap bytes each entry point holds once imported. The default is 3.5 MB; the same entries load
  # everything.
  import-memory:
    target: 3.5MB
    targets:
      ox: 8MB
      ox/tempo*: 6MB
  # The hot items of .agents/uphill/hot.ts against what a comparable library achieves, as
  # hot-entry-size explains: each call against viem 2, ethers 6, and the other ox branch called warm
  # with the same arguments, and each import against the other ox branch. Times and allocations allow 1.25×, and import
  # memory 1.1×, for noise between runs, and a call stops at 10 ns, where it is too short to time.
  # Each branch replays its own tests' arguments, so the other branch's speed targets differ.
