speed:
  run: bun .agents/metrics/speed.ts
  # Recording ox's tests takes about 75 s (more the first time anvil's fork cache fills), and each
  # replay about 5.3 minutes at concurrency 2; `uphill` (5 rounds) takes about 27 minutes.
  timeout: 60m
  # CPU time per call of each public function, replaying the arguments ox's own tests call it
  # with, in a fresh `node --single-threaded` process on src/_esm. ox's caches are emptied before
  # every call, so each call does a first call's work while caching still works inside it, and
  # the note gives the time with them warm. Three quarters of the calls take under 11 µs, so the
  # default is 20 µs, the same as on ox's main branch. Cryptography and key derivation whose cost
  # is noble's (or, for the KZG functions, the micro-eth-signer KZG that ox's tests inject) has a
  # target about 1.5 times its time today on this branch, since CPU time varies by up to 1.5x
  # between runs on this machine. Keccak-bound hashing (TypedData, ABI selectors, transaction
  # hashes) keeps the default, so it shows as the opportunity it is. The first matching pattern
  # applies.
  call-time:
    target: 20µs
    targets:
      'ox:Blobs.toProofs': 2.6s
      'ox:Blobs.toCommitments': 1.8s
      'ox:Blobs.toVersionedHashes': 1.8s
      # 262,144 rounds of PBKDF2 by default, in noble or in WebCrypto.
      'ox:Keystore.pbkdf2': 620ms
      'ox:Keystore.pbkdf2Async': 60ms
      # 900,000 rounds of WebCrypto PBKDF2.
      'ox:AesGcm.getKey': 200ms
      # Key derivation with scrypt, or PBKDF2 at the recorded call's rounds.
      'ox:Keystore.*': 50ms
      'ox:Bls.verify': 38ms
      'ox:Bls.sign': 30ms
      'ox:Bls*': 1.5ms
      # BIP-39 derives the seed with 2,048 rounds of PBKDF2-HMAC-SHA512.
      '*:*.fromMnemonic': 16ms
      'ox:Mnemonic.to*': 17ms
      'ox:Mnemonic.*': 200µs
      # Each recovers every signer's public key once.
      'ox/tempo:AccountOperation.selectApprovals': 8ms
      'ox/tempo:SignatureEnvelope.sortApprovals': 7ms
      'ox/tempo:SignatureEnvelope.*': 3.5ms
      'ox/webauthn:Registration.verify': 3.7ms
      '*:*.getSharedSecret': 4ms
      '*:*.recover*': 3.4ms
      '*:*.verify': 3.5ms
      # Recovers the authorization's signer.
      'ox/erc8010:SignatureErc8010.wrap': 2.8ms
      'ox:X25519.*': 1.2ms
      'ox:HdKey.*': 1.1ms
      'ox:Blobs.*': 900µs
      'ox:Secp256k1.*': 600µs
      'ox:P256.*': 420µs
      'ox:Ed25519.*': 450µs
      'ox:WebCryptoP256.*': 150µs
      'ox:BinaryStateTree.*': 320µs
      # The recorded call converts a 128 kB blob.
      'ox:Bytes.toHex': 250µs
  # Heap bytes each call allocates, v8.GCProfiler minus a no-op loop. Three quarters of the calls
  # allocate under 6 kB, so the default is 20 kB, the same as on ox's main branch. The same
  # cryptography has a target about 1.25 times its allocation today, which barely varies (p95 of
  # run-to-run ratio 1.01).
  call-memory:
    varies: true
    target: 20kB
    targets:
      'ox:Blobs.toProofs': 1.6GB
      'ox:Blobs.toCommitments': 1.1GB
      'ox:Blobs.toVersionedHashes': 1.1GB
      'ox:Keystore.pbkdf2': 300MB
      'ox:Keystore.pbkdf2Async': 15kB
      'ox:AesGcm.getKey': 25kB
      'ox:Keystore.*': 5MB
      'ox:Bls.verify': 28MB
      'ox:Bls.sign': 20MB
      'ox:Bls*': 800kB
      '*:*.fromMnemonic': 12MB
      'ox:Mnemonic.to*': 12.5MB
      'ox:Mnemonic.*': 360kB
      'ox/tempo:AccountOperation.selectApprovals': 4.2MB
      'ox/tempo:SignatureEnvelope.sortApprovals': 3.9MB
      'ox/tempo:SignatureEnvelope.*': 2.1MB
      'ox/webauthn:Registration.verify': 2.2MB
      '*:*.getSharedSecret': 2.6MB
      '*:*.recover*': 2.2MB
      '*:*.verify': 2.1MB
      'ox/erc8010:SignatureErc8010.wrap': 1.3MB
      'ox:X25519.*': 750kB
      'ox:HdKey.*': 630kB
      'ox:Blobs.*': 330kB
      'ox:Secp256k1.*': 330kB
      'ox:P256.*': 350kB
      'ox:Ed25519.*': 370kB
      'ox:BinaryStateTree.*': 450kB
      'ox:Bytes.toHex': 330kB
  # CPU time to import each entry point, barrels included, in a fresh Node process. Half the
  # entries take under 28 ms and 90% under 63 ms; the default is 60 ms, the same as on ox's main
  # branch. On this branch noble's BLS12-381 builds its curve when `ox/Bls` and `ox/BlsPoint` load.
