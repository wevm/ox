# ox's metrics (0.x line). Each script fans out over every public export of ox's entry points, the
# subpaths `scripts/utils/exports.ts` derives from src/ and prepublish writes to
# src/package.json#exports, so each export and each public function scores on its own. The
# metrics, defaults, item names and hot set are shared with ox's main branch, so a target pattern
# means the same item on both. Items are named the way users import them (.agents/metrics/names.ts):
# a member of a namespace as `<index entry>:<Namespace>.<member>`, such as `ox:Hex.fromString` or
# `ox/tempo:SignatureEnvelope.sortApprovals`; a whole namespace as `ox:Hex`; a whole index entry by
# its specifier, such as `ox` or `ox/tempo`. The per-module metrics (`tree-shaking`, `import-time`
# and `import-memory`) name their items by the module entry, such as `ox/Hex`. The scripts measure
# the build that `pnpm build` writes to src/_esm and src/_types.
#
# There is no latency category: viem's checks awaits of independent RPC reads, and ox's few async
# functions (WebAuthn, WebCrypto, Keystore, AesGcm, RpcTransport) chain no independent requests.

# Install scripts stay off (ox's postinstall builds contracts with Foundry, which no metric needs).
# The scripts keep their own dependencies, such as rolldown and fast-check, in .agents/metrics.
setup: 'pnpm install --frozen-lockfile --ignore-scripts && pnpm build && bun install --cwd .agents/metrics'

footprint:
  run: bun .agents/metrics/footprint.ts
  # Gzipped bytes a consumer bundles to import one export the way users import it, such as
  # `import { Hex } from 'ox'; export const $ = Hex.fromString` for `ox:Hex.fromString`, a whole
  # namespace, such as `ox:Hex`, or a whole index entry, such as `ox/tempo`. rolldown bundles and
  # minifies each import for the browser. Encoders, decoders and envelopes without a curve bundle 1
  # to 9 kB, so the default is 10 kB, the same as on ox's main branch. Other targets sit where a
  # known change puts each kind, such as constants without top-level side effects and helpers
  # without a curve, or just above today's size where none is known. The first matching pattern
  # applies.
  entry-size:
    target: 10kB
    targets:
      # An error class extends `BaseError` (about 0.7 kB) and adds a message.
      '*:*.*Error': 1kB
      # Whole barrels and namespaces that carry data.
      ox: 220kB
      ox/tempo: 65kB
      'ox:Mnemonic': 100kB
      ox/webauthn: 32kB
      ox/erc8010: 30kB
      # Modules whose functions sign, verify, recover or derive keys bundle a curve, and tempo's
      # signature envelopes bundle secp256k1 and P-256.
      'ox:Bls*': 25kB
      'ox/tempo:*': 32kB
      'ox/webauthn:*': 26kB
      'ox:WebAuthnP256*': 20kB
      'ox:WebCryptoP256*': 20kB
      'ox:Secp256k1*': 25kB
      'ox:P256*': 20kB
      'ox:Ed25519*': 15kB
      'ox:HdKey*': 25kB
      'ox:Mnemonic*': 25kB
      # ENS normalization bundles @adraffy/ens-normalize's tables.
      'ox:Ens*': 30kB
      # wrap recovers the authorization's signer.
      'ox/erc8010:*': 25kB
  # Whether each module entry, such as `ox/Hex`, has no top-level code a bundler must keep: a call
  # without a `/*#__PURE__*/` annotation, a `2n ** 8n`, a runtime TypeScript namespace, or a static
  # class field. Such code stays in every bundle that uses anything from the module, and in a
  # bundle that imports the module for nothing when ox's `"sideEffects": false` is out of reach.
  # The note names what stays.
  tree-shaking: {}
  # The parts of ox its users lean on most, listed in .agents/metrics/hot.ts, scored on their own:
  # in entry-size, a few dozen items that miss their targets hide under its p90. Each target is a
  # tenth of what the item bundles today, and no lower than 250 B, about what a function that throws
  # no error bundles. Some tenths sit below what the work itself needs, such as keccak's or
  # secp256k1's code, so the list scores its median, which reaches 90 once half the items bundle
  # ten times less.
  hot-entry-size:
    target: 1kB
    score: median
    targets:
      'ox:Hex.fromBytes': 250B # 1.2kB today
      'ox:Hex.fromNumber': 250B # 1.3kB today
      'ox:Hex.slice': 250B # 950B today
