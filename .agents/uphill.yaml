# Type-checking cost at the call sites ox's tests write: one call per public function, the first in
# its module's own tests (in the describe named after it when there is one), else its type tests,
# else any test. Each call is copied into `const $uphill = <call>` before its statement and checked
# in a fresh checker once its imports, fixtures and the callee's signature are resolved, so the count
# is inferring and checking the call, including the first use of the types it touches. Exact, so
# one run suffices: about 30 s at UPHILL_CONCURRENCY=1.
call-types:
  run: bun .agents/metrics/types-calls.ts
  timeout: 10m
  # p50 11, p90 643. A call should cost under 1,000, and one that infers from an ABI or typed data
  # under 5,000, as on ox's main branch. TypedData's non-generic helpers infer nothing, so they keep
  # 1,000. The first match applies.
  instantiations:
    target: 1000
