name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

inputs:
  skip-cache:
    description: 'Skip dependency cache restore/save'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up foundry
      uses: wevm/actions/vendor/foundry-rs/foundry-toolchain/v1.6.0@ce3e8f4d50163a659a550102f4beb1c100cb2b8b
      with:
        version: nightly

    - name: Set up pnpm
      uses: wevm/actions/.github/actions/pnpm@ce3e8f4d50163a659a550102f4beb1c100cb2b8b
      with:
        node-version: 24.22.1
        skip-cache: ${{ inputs.skip-cache }}
