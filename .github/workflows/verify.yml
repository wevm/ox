name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code
        run: pnpm check

      - name: Check types
        run: pnpm check:types

      - name: Check examples
        run: pnpm zile examples:check

  test-core:
    name: Test Runtime (core)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: pnpm test --project core --bail=1 --coverage
        env:
          VITE_ANVIL_FORK_URL: ${{ secrets.VITE_ANVIL_FORK_URL }}

  test-browser:
    name: Test Runtime (browser)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: pnpm test --project browser --project browser-webauthn --bail=1

  test-tempo:
    name: 'Test Runtime (tempo, env: localnet, tag: ${{ matrix.tag }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `edge` tracks `tempoxyz/tempo` main and includes unreleased
        # features the tests depend on (e.g. TIP-1049 admin keys). The
        # `latest` tag is pinned to released versions and lags behind.
        tag:
          - edge
          # - https://rpc.moderato.tempo.xyz

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: pnpm test --project tempo-unit --project tempo --bail=1 --coverage
        env:
          VITE_TEMPO_CREDENTIALS: ${{ secrets.VITE_TEMPO_CREDENTIALS }}
          VITE_TEMPO_TAG: ${{ matrix.tag }}

  test-tempo-multisig:
    name: Test Runtime (tempo multisig)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: pnpm test --project tempo-multisig --bail=1

  # test-tempo-e2e:
  #   name: 'Test Runtime (tempo, env: ${{ matrix.tempo-env }}, e2e)'
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       tempo-env:
  #         # - devnet TODO: re-enable.
  #         - testnet

  #   steps:
  #     - name: Clone repository
  #       uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
  #       with:
  #         submodules: 'recursive'

  #     - name: Install dependencies
  #       uses: ./.github/actions/install-dependencies

  #     - name: Run tests
  #       run: pnpm test --project tempo e2e --bail=1
  #       env:
  #         VITE_TEMPO_CREDENTIALS: ${{ secrets.VITE_TEMPO_CREDENTIALS }}
  #         VITE_TEMPO_ENV: ${{ matrix.tempo-env }}

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # 10k runs per property, across Node and all three browser engines. The
      # counterexamples behind the `Hex` and `Base64` decode fixes surfaced at
      # iterations 372 and 1612, so the previous budget of 200 could not have
      # found either, and the Chromium one only shows in a browser.
      # `fuzz-soak.yml` runs the same properties far longer on a schedule.
      - name: Run bounded fuzz tests
        run: pnpm test:fuzz:ci

  vectors:
    name: Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run test vectors
        shell: bash
        run: pnpm vectors

  wasm:
    name: WASM Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WASM toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .wasm-toolchain
          key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('wasm/toolchain.json') }}

      - name: Verify committed artifacts are reproducible
        run: pnpm wasm:check
