name: Fuzz Soak
on:
  workflow_dispatch:
  schedule:
    # Nightly. `fast-check` draws a fresh seed per run, so each night explores
    # ground the pull-request budget never reaches.
    - cron: '0 3 * * *'

jobs:
  soak:
    name: Fuzz Soak
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # No `--bail`: a soak run should report every property that fails, not
      # stop at the first. Counterexamples belong in a `*.test.ts` or a vector
      # fixture once minimized, so a failure here is a request for a commit,
      # not something to re-run until it passes.
      - name: Run fuzz soak
        run: pnpm test:fuzz:soak
