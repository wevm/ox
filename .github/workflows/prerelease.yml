name: Prerelease
on: [push, pull_request]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Prerelease
        run: |
          pnpm exports:update
          pnpm exec zile publish:prepare
          node --import tsx ./scripts/exports:internal-types.ts
          pnpx pkg-pr-new publish --pnpm
